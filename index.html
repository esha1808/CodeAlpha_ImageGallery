<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>📸 Pixel Gallery</h2>
        <p>Explore • Discover • Enjoy</p>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <h1>Explore the World Through Images</h1>
        <p>Every picture tells a beautiful story.</p>
    </header>

    <!-- Category Filters -->
    <section class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
        <button class="filter-btn" data-filter="architecture">Architecture</button>
    </section>

    <!-- Image Gallery -->
    <main class="gallery" id="gallery">

        <!-- Nature Images -->
        <div class="image-card" data-category="nature">
            <img src="images/Nature1.jpg" alt="Nature 1">
        </div>

        <div class="image-card" data-category="nature">
            <img src="images/Nature2.jpg" alt="Nature 2">
        </div>

        <div class="image-card" data-category="nature">
            <img src="images/Nature3.jpg" alt="Nature 3">
        </div>

        <div class="image-card" data-category="nature">
            <img src="images/Nature4.jpg" alt="Nature 4">
        </div>

        <div class="image-card" data-category="nature">
            <img src="images/Nature5.jpg" alt="Nature 5">
        </div>

        <div class="image-card" data-category="nature">
            <img src="images/Nature6.jpg" alt="Nature 6">
        </div>

        <!-- Animal Images -->
        <div class="image-card" data-category="animals">
            <img src="images/Animal1.jpg" alt="Animal 1">
        </div>

        <div class="image-card" data-category="animals">
            <img src="images/Animal2.jpg" alt="Animal 2">
        </div>

        <!-- Travel Images -->
        <div class="image-card" data-category="travel">
            <img src="images/Travel1.jpg" alt="Travel 1">
        </div>

        <div class="image-card" data-category="travel">
            <img src="images/Travel2.jpg" alt="Travel 2">
        </div>

        <!-- Architecture Images -->
        <div class="image-card" data-category="architecture">
            <img src="images/Architecture1.jpg" alt="Architecture 1">
        </div>

        <div class="image-card" data-category="architecture">
            <img src="images/Architecture2.jpg" alt="Architecture 2">
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img src="" alt="Full Size Image" id="lightbox-img">

        <button class="next" id="next">&#10095;</button>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Pixel Gallery | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
